<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>预约 · 排队叫号</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
</head>
<body>

<!-- 头部：店铺信息 -->
<header class="shop-header">
  <div class="container shop-header-inner">
    <div class="shop-logo" id="shopLogo">📅</div>
    <div class="shop-title">
      <h1 id="shopName">加载中…</h1>
      <span class="subtitle" id="shopIntro"></span>
    </div>
    <div class="header-actions">
      <button type="button" id="myBookingsBtn" class="btn btn-ghost btn-sm" title="我的预约">
        <span>📋</span><span class="text-hidden-mobile">我的预约</span>
      </button>
      <a href="#" id="queueLink" class="btn btn-ghost btn-sm" title="看排队">
        <span>📣</span><span class="text-hidden-mobile">排队</span>
      </a>
    </div>
  </div>
</header>

<!-- Hero 欢迎区 -->
<section class="hero" id="hero">
  <div class="container hero-inner">
    <div class="hero-badge">📅 在线预约 · 免排队</div>
    <h1 class="hero-title" id="heroName">加载中…</h1>
    <p class="hero-sub" id="heroIntro"></p>
    <div class="hero-actions">
      <a href="#timeSection" class="btn btn-primary btn-lg">✨ 立即预约</a>
      <button type="button" id="heroMyBtn" class="btn btn-ghost btn-lg">📋 我的预约</button>
    </div>
  </div>
</section>

<!-- 主体 -->
<main class="container" style="padding-top: 24px; padding-bottom: 60px;">

  <!-- Step 1: 选择服务 -->
  <section class="card mb-4">
    <h2 class="card-title"><span class="icon">✂️</span> 1. 选择服务</h2>
    <div id="categoryRow" class="category-row hidden"></div>
    <div id="serviceGrid" class="service-grid">
      <div class="loading"><span class="spinner"></span> 加载中…</div>
    </div>
  </section>

  <!-- Step 2: 选择时间 -->
  <section class="card mb-4 hidden" id="timeSection">
    <h2 class="card-title"><span class="icon">🕒</span> 2. 选择时间</h2>
    <div class="date-row" id="dateRow"></div>
    <div id="slotGrid" class="slot-grid"></div>
    <p class="text-sm text-muted mt-3" id="slotHint"></p>
  </section>

  <!-- Step 3: 填写信息 -->
  <section class="card mb-4 hidden" id="infoSection">
    <h2 class="card-title"><span class="icon">📝</span> 3. 填写预约信息</h2>

    <div class="field">
      <label class="field-label">姓名 <span class="req">*</span></label>
      <input type="text" class="input" id="customerName" placeholder="您的称呼" maxlength="50">
    </div>

    <div class="field">
      <label class="field-label">手机号 <span class="req">*</span></label>
      <input type="tel" class="input" id="customerPhone" placeholder="用于接收叫号通知" maxlength="20">
    </div>

    <div class="field">
      <label class="field-label">邮箱（可选）</label>
      <input type="email" class="input" id="customerEmail" placeholder="填写后发送预约确认邮件" maxlength="100">
    </div>

    <div class="field">
      <label class="field-label">备注（可选）</label>
      <textarea class="textarea" id="customerNote" placeholder="过敏原、偏好等" maxlength="500"></textarea>
    </div>

    <div id="bookingSummary" class="text-sm text-muted mt-3" style="padding: 12px; background: var(--cream-2); border-radius: var(--radius-sm);"></div>

    <button class="btn btn-primary btn-lg btn-block mt-4" id="submitBtn">
      📅 提交预约
    </button>
  </section>

  <!-- 成功弹窗 -->
  <div id="successModal" class="modal-overlay hidden">
    <div class="modal" style="text-align: center;">
      <div style="font-size: 56px; margin-bottom: 8px;">🎉</div>
      <h2 class="modal-title" style="text-align: center; margin-bottom: 8px;">预约成功！</h2>
      <p class="text-muted mb-4">请按时到店，我们会为您准备。</p>
      <div id="successDetail" class="text-sm" style="background: var(--cream-2); padding: 16px; border-radius: var(--radius-sm); text-align: left;"></div>
      <div class="modal-actions" style="justify-content: center;">
        <button class="btn btn-ghost" id="successCloseBtn">关闭</button>
        <a href="#" id="successQueueBtn" class="btn btn-secondary">📣 看排队叫号</a>
      </div>
    </div>
  </div>

</main>

<footer class="text-center text-sm text-muted" style="padding: 28px 0; border-top: 1px solid var(--border);">
  由 <strong>shop-booking</strong> 提供 · <a id="adminLink" href="/admin.html" style="color: var(--text-2);">商家后台</a>
</footer>

<!-- 我的预约弹窗 -->
<div id="myBookingsModal" class="modal-overlay hidden">
  <div class="modal" style="max-width: 460px;">
    <h2 class="modal-title" style="text-align: left;">📋 我的预约</h2>
    <p class="text-muted text-sm" style="margin-bottom: 12px;">输入预约时填写的手机号，查看并管理你的预约。</p>
    <div class="field">
      <label class="field-label">手机号 <span class="req">*</span></label>
      <input type="tel" class="input" id="myPhone" placeholder="预约时填写的手机号" maxlength="20">
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary btn-block" id="myLookupBtn">查询</button>
    </div>
    <div id="myBookingsList" class="mt-3"></div>
  </div>
</div>

<!-- toast 容器 -->
<div id="toast" class="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/booking.js"></script>
<script>
  // 从 URL 参数读 shopCode
  const shopCode = new URLSearchParams(location.search).get('shop') || 'tonys-hair';
  const queueUrl = `/queue.html?shop=${encodeURIComponent(shopCode)}`;
  document.getElementById('queueLink').href = queueUrl;
  document.getElementById('successQueueBtn').href = queueUrl;

  // 启动 booking
  const app = new BookingApp({ shopCode });
  app.init();
</script>

</body>
</html>
