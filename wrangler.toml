# Cloudflare Pages 项目配置
# 部署命令：wrangler pages deploy . --project-name=shop-booking
# 本地开发：wrangler dev --port 8787

name = "shop-booking"
pages_build_output_dir = "public"

compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# D1 数据库绑定（本地名 DB，对应后端 env.DB）
# 共用 Cloudflare D1「dev」数据库（与 linguaverse-web / workbench-mobile / event-signin 等同一库），
# 本项目所有业务表统一带 sb_ 前缀以隔离表空间。
[[d1_databases]]
binding = "DB"
database_name = "dev"
database_id = "3c83aee3-4645-450b-b50b-6488750deeb4"

# R2 存储绑定（本地名 R2，对应后端 env.R2）
[[r2_buckets]]
binding = "R2"
bucket_name = "shop-booking-images"

# 部署前先在 Cloudflare Dashboard 创建 D1 database 和 R2 bucket，
# 然后把上面的 database_id / bucket_name 换成你实际的值。
# 详见 README.md 的「第一次部署」章节。
